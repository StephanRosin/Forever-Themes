<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="0.6" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#e8c25a"/>
      <stop offset="0.7" stop-color="#a87a22"/>
      <stop offset="1" stop-color="#6e4c12"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3518"/>
      <stop offset="0.5" stop-color="#7a4a22"/>
      <stop offset="1" stop-color="#4a2a12"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe0b8"/>
      <stop offset="1" stop-color="#cdb27a"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#2d6fa8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a1e3a"/>
      <stop offset="0.5" stop-color="#2b3f8f"/>
      <stop offset="1" stop-color="#1f6a4a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <!-- one swatch card: 92 x 300, pivot at its bottom centre -->
    <clipPath id="card"><rect x="-46" y="-300" width="92" height="300" rx="12"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- a fan of theme swatches, pivoting on a gold rivet -->
  <g transform="translate(256 400) scale(0.8)">
    <!-- Wood -->
    <g transform="rotate(-60)" filter="url(#shadow)">
      <g clip-path="url(#card)">
        <rect x="-46" y="-300" width="92" height="300" fill="url(#wood)"/>
        <path d="M-46 -260 q46 10 92 0 M-46 -200 q46 -12 92 0 M-46 -140 q46 9 92 0" stroke="#3a200c" stroke-width="3" fill="none" opacity="0.6"/>
      </g>
      <rect x="-46" y="-300" width="92" height="300" rx="12" fill="none" stroke="url(#gold)" stroke-width="5"/>
    </g>
    <!-- Parchment -->
    <g transform="rotate(-40)" filter="url(#shadow)">
      <g clip-path="url(#card)">
        <rect x="-46" y="-300" width="92" height="300" fill="url(#parch)"/>
        <circle cx="0" cy="-250" r="14" fill="#9c1d1d"/>
      </g>
      <rect x="-46" y="-300" width="92" height="300" rx="12" fill="none" stroke="#7a5a2a" stroke-width="4"/>
    </g>
    <!-- Stained glass -->
    <g transform="rotate(-20)" filter="url(#shadow)">
      <g clip-path="url(#card)">
        <rect x="-46" y="-300" width="92" height="300" fill="url(#glass)"/>
        <path d="M-46 -230 L46 -270 M-46 -170 L46 -200 M0 -300 L0 -150" stroke="#111" stroke-width="5"/>
      </g>
      <rect x="-46" y="-300" width="92" height="300" rx="12" fill="none" stroke="#1a1a1a" stroke-width="5"/>
    </g>
    <!-- Frost -->
    <g transform="rotate(0)" filter="url(#shadow)">
      <g clip-path="url(#card)">
        <rect x="-46" y="-300" width="92" height="300" fill="url(#frost)"/>
        <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" transform="translate(0 -245)">
          <path d="M0 -22 V22 M-19 -11 L19 11 M-19 11 L19 -11"/>
        </g>
      </g>
      <rect x="-46" y="-300" width="92" height="300" rx="12" fill="none" stroke="#dff3ff" stroke-width="4"/>
    </g>
    <!-- Comic -->
    <g transform="rotate(20)" filter="url(#shadow)">
      <g clip-path="url(#card)">
        <rect x="-46" y="-300" width="92" height="300" fill="#ffd23a"/>
        <g fill="#e09a00" opacity="0.55">
          <circle cx="-28" cy="-280" r="5"/><circle cx="-8" cy="-280" r="5"/><circle cx="12" cy="-280" r="5"/><circle cx="32" cy="-280" r="5"/>
          <circle cx="-18" cy="-262" r="5"/><circle cx="2" cy="-262" r="5"/><circle cx="22" cy="-262" r="5"/>
        </g>
      </g>
      <rect x="-46" y="-300" width="92" height="300" rx="12" fill="none" stroke="#111" stroke-width="6"/>
    </g>
    <!-- Swiss Clean -->
    <g transform="rotate(40)" filter="url(#shadow)">
      <g clip-path="url(#card)">
        <rect x="-46" y="-300" width="92" height="300" fill="#0a0a0a"/>
        <rect x="-46" y="-300" width="92" height="10" fill="#f2f2f2"/>
        <rect x="-18" y="-262" width="36" height="36" fill="#ff2d20"/>
      </g>
      <rect x="-46" y="-300" width="92" height="300" rx="12" fill="none" stroke="#2a2a2a" stroke-width="3"/>
    </g>
    <!-- Pitwall -->
    <g transform="rotate(60)" filter="url(#shadow)">
      <g clip-path="url(#card)">
        <rect x="-46" y="-300" width="92" height="300" fill="#0a0a0a"/>
        <rect x="-46" y="-300" width="92" height="34" fill="#000"/>
        <path d="M-46 -300 h30 l-14 34 h-16 Z" fill="#e10600"/>
      </g>
      <rect x="-46" y="-300" width="92" height="300" rx="12" fill="none" stroke="#2a2a2a" stroke-width="3"/>
    </g>
    <!-- gold rivet -->
    <circle r="26" fill="url(#gold)" filter="url(#shadow)"/>
    <circle r="14" fill="none" stroke="#6e4c12" stroke-width="4"/>
  </g>
</svg>
